<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    
</head>
<body>
    <header>
        <h3> Formulários e inputs</h3>
    </header>
    <main>
            <form id="registerForm" method="Post">
                <label>Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
                <br>
                <label for="email"> Endereço de email:</label>
                <input type="email" id="email" name="email">
                <br>
                <label for="senha">informe sua senha:</l</label>
                <input type="password" id="senha" name="senha" required minlenght="8"/>
                <br>
                <br>
            
                <label for ="mensagem">Informe sua mensagem:</label>
                <br>

                <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea>
                <br>
                <br>
                <label for="evento"></label>Selecione o evento escolhido: </label>
                <select> id="evento" name="evento"
                    <option value="Rock">Show de Rock</option>
                    <option value="Modao">Show de Modão</option>
                    <option value="Teatro">Show de Teatro</option>
                </select>
                <br>
                <br>
                <label for="termos">
                <input type="checkbox" id="termos" name="termos" required>
                Aceito os termos de uso
                </label>
                <br>
                <label><input type="radio" name="Pagamento" value="Pix">Pix </label>
                <label><input type="radio" name="Pagamento" value="Cartao">Cartão </label>
                <br>
                <input type="date">
                <br>
                <br>
                <input type="file">
                <br>
                <br>
                <input type="text" id="cpf" name="cpf"placeholder="000.000.000-00" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"title="Formato esperado: 000.000.000-00"/>
        
                <input type="submit" value="Cadastrar" />

                <button type="button" onclick="Cancelar">Cancelar</button>

            </form>
    </main>
    <footer>
        <p>Desenvolvido por Yagooool</p>
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (event)
    {
        event.preventDefault(); // Impede o comportamento padrão de envio do formulário(recarregamento)
        const nome = document.getElementById('nome').value;
        alert('Olá, '+ nome+' cadastro enviado com sucesso');

    })
</script>

</body>
</html>
